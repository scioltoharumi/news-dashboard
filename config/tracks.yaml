# tracks.yaml — 定常トラック（4 トピック、D-35）
# 正の定義: 04_core/02_information_architecture.md §2
# スコア式: freshness * 0.5 + popularity * 0.5 + keyword_match * 0.1
# 記事は最高スコアのトラックへ分類（補助タグとして layer / 重要度 / 問い を別途付与）
# UI フィルタ軸: topic × importance（D-32、D-35）

tracks:
