name: Deploy GitHub Pages

# D-41: 日次 pipeline は Claude Code `/loop` がローカルで実行 → push する。
# このワークフローは push を受けて site/ を Pages へデプロイするだけ。
# Repository Settings → Pages → Source: GitHub Actions に設定が必要。

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行制限: 進行中のデプロイをキャンセルしない（待機）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
